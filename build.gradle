import org.apache.tools.ant.taskdefs.condition.Os
import org.gradle.process.ExecOperations

import javax.inject.Inject

plugins {
    id "net.researchgate.release"
}

abstract class ExecOperationsHolder {
    @Inject
    abstract ExecOperations getExecOperations()
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.pkg.github.com/ballerina-platform/*'
        credentials {
            username System.getenv("packageUser")
            password System.getenv("packagePAT")
        }
    }
}

// The build runs the Ballerina distribution matching ballerinaLangVersion instead of whichever `bal` is installed
configurations {
    ballerinaDistribution
}

dependencies {
    ballerinaDistribution "org.ballerinalang:jballerina-tools:${ballerinaLangVersion}@zip"
}

def ballerinaDistributionDir = layout.buildDirectory.dir("ballerina-distribution").get().asFile
ext.ballerinaHome = new File(ballerinaDistributionDir, "jballerina-tools-${ballerinaLangVersion}")
def balLauncher = new File(ballerinaHome, Os.isFamily(Os.FAMILY_WINDOWS) ? "bin/bal.bat" : "bin/bal")
def execOperations = objects.newInstance(ExecOperationsHolder).execOperations

tasks.register('unpackBallerinaDistribution', Copy) {
    from { zipTree(configurations.ballerinaDistribution.singleFile) }
    into ballerinaDistributionDir
    doLast {
        balLauncher.setExecutable(true)
    }
}

// Runs a `bal` command of the provisioned distribution on the JDK running the build
ext.runBal = { File workingDirectory, String... balArguments ->
    execOperations.exec {
        workingDir workingDirectory
        environment 'JAVA_HOME', System.getProperty('java.home')
        if (Os.isFamily(Os.FAMILY_WINDOWS)) {
            commandLine(['cmd', '/c', balLauncher.absolutePath] + balArguments.toList())
        } else {
            commandLine([balLauncher.absolutePath] + balArguments.toList())
        }
    }
}

subprojects {
    apply plugin: 'java-library'
}

project(':scan-command') {
    dependencies {
        tasks.test{
            dependsOn ':scan-package:build'
            dependsOn ':test-compiler-plugins:exampleOrg-plugin:build'
            dependsOn ':test-compiler-plugins:ballerina-plugin:build'
            dependsOn ':test-compiler-plugins:ballerinax-plugin:build'
            dependsOn ':test-compiler-plugins:invalid-rules-plugin:build'
            dependsOn ':test-compiler-plugins:invalid-ruleformat-plugin:build'
            dependsOn ':test-compiler-plugins:invalid-rulekind-plugin:build'
            dependsOn ':test-static-code-analysis-platform-plugins:exampleOrg-static-code-analysis-platform-plugin:build'
        }
    }
}

project(':test-compiler-plugins:exampleOrg-plugin') {
    dependencies {
        implementation project(':scan-command')
    }
}

project(':test-compiler-plugins:ballerina-plugin') {
    dependencies {
        implementation project(':scan-command')
    }
}

project(':test-compiler-plugins:ballerinax-plugin') {
    dependencies {
        implementation project(':scan-command')
    }
}

project(':test-compiler-plugins:invalid-rules-plugin') {
    dependencies {
        implementation project(':scan-command')
    }
}

project(':test-compiler-plugins:invalid-ruleformat-plugin') {
    dependencies {
        implementation project(':scan-command')
    }
}

project(':test-compiler-plugins:invalid-rulekind-plugin') {
    dependencies {
        implementation project(':scan-command')
    }
}

project(':test-static-code-analysis-platform-plugins:exampleOrg-static-code-analysis-platform-plugin') {
    dependencies {
        implementation project(':scan-command')
    }
}

// Release scan tool to GitHub
def moduleVersion = project.version.replace("-SNAPSHOT", "")
release {
    failOnSnapshotDependencies = true
    versionPropertyFile = 'gradle.properties'
    tagTemplate = 'v${version}'

    git {
        requireBranch = "release-${moduleVersion}"
        pushToRemote = 'origin'
    }
}

// The release plugin adds the root build task; it builds the scan tool
tasks.named('build') {
    dependsOn ':scan-command:build'
}
