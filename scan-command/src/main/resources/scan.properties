# ------------------------
# Scan Tool error messages
# ------------------------
error.invalid.number.of.arguments=\
  too many arguments: expected one package or source file, but received {0}: {1}

error.empty.package=\
  package has no sources to scan; add at least one .bal file

error.missing.config.field=\
  failed to load scan tool configurations: cannot find ''configPath''

error.loading.remote.config.file=\
  failed to load configuration file: {0}

error.reading.config.file=\
  failed to read the configuration file: {0}

error.platform.file.not.found=\
  ''{1}'' of platform ''{0}'' is not a file or a URL: {2}

error.downloading.remote.jar.file=\
  failed to download remote jar file: ''{0}''

error.loading.compiler.plugin=\
  failed to load compiler plugin: {0}

error.missing.rules.file=\
  failed to load analysis rules from ''{0}'': cannot find file ''{1}''

error.reading.rules.file=\
  failed to read the ''{0}'' file from ''{1}'': {2}

error.invalid.json.format=\
  invalid json format for ''{0}'' in plugin ''{1}''. expected an array, but found: {2}

error.invalid.json.format.rule=\
  invalid json format for rule object in plugin ''{0}''. \
  rule object should contain ''id'', ''kind'', and ''description'' but found: {1}

error.invalid.json.format.rule.kind=\
  invalid kind for rule object in plugin ''{0}''. Expected one of {1}, but found: ''{2}''

error.invalid.json.format.rule.severity=\
  invalid severity for rule object in plugin ''{0}''. Expected one of {1}, but found: ''{2}''

error.failed.to.read.ballerina.file=\
  failed to read the ballerina file: {0}

error.failed.to.copy.scan.report=\
  failed to copy the scan report: {0}

error.rule.not.found=\
  rule not found: invalid rule numeric identifier ''{0}''

error.attempt.to.include.and.exclude=\
  cannot include and exclude rules at the same time

error.invalid.format=\
  invalid value ''{0}'' for --format; expected json or sarif

error.compilation.contains.errors=\
  compilation contains errors, skipping the scan

error.suppression.missing.reason=\
  suppression has no reason, but the project requires one (requireReason)

error.suppression.missing.rule.id=\
  suppression names no rule, but the project requires one (requireRuleId)

error.suppression.requirements.not.met=\
  {1} invalid {0,choice,1#suppression|1<suppressions}

error.unknown.rule=\
  unknown rule ''{0}'': ''{1}'' does not define this rule

error.invalid.suppression.setting=\
  failed to load scan tool configurations: ''{0}'' in the [suppression] table must be true or false

error.empty.rule.list=\
  empty rule list; name the rules to suppress, or omit ''rules'' to suppress every rule

error.invalid.rule.id=\
  invalid rule ID ''{0}'': expected ''ballerina:<number>'' or ''<org>/<package>:<number>''

error.unknown.suppression.setting=\
  failed to load scan tool configurations: unknown setting ''{0}'' in the [suppression] table; \
  expected one of ''enabled'', ''requireReason'' or ''requireRuleId''

error.invalid.suppression.table=\
  failed to load scan tool configurations: ''suppression'' must be a table, written as [suppression]

error.missing.dependencies.toml=\
  cannot scan package ''{0}'': its dependencies are not locked in Dependencies.toml; run ''bal build'' first

error.invalid.option.value=\
  invalid value ''{0}'' for {1}; expected {2}

error.unknown.rule.option=\
  unknown {1,choice,1#rule|1<rules} {0}

error.invalid.project.path=\
  not a Ballerina package, workspace or source file: {0}

error.file.in.package=\
  cannot scan a file inside a package: {0}; scan the package at {1}

error.project.load.failed=\
  failed to load the project at {0}

error.config.file.has.errors=\
  {0} has {2} {1,choice,1#error|1<errors}

error.invalid.config.value=\
  invalid value ''{0}'' for ''{1}''; expected {2}

error.unknown.config.key=\
  unknown key ''{0}'' in [{1}]; expected {2}

error.platform.not.available=\
  {0,choice,1#platform|1<platforms} {1} {0,choice,1#is|1<are} not available; \
  add {0,choice,1#its plugin|1<their plugins} to the [[platform]] table of Scan.toml

error.failed.to.write.report=\
  failed to write the report {0}: {1}

error.gate.failed=\
  {4} {0,choice,1#issue|1<issues} at or above {1}, limit {2} ({3})

error.packages.failed.gate=\
  {1} {0,choice,1#package|1<packages} failed the gate

error.packages.failed=\
  {1} {0,choice,1#package|1<packages} failed

error.workspace.platform.not.allowed=\
  [[platform]] cannot be set in a workspace Scan.toml; set it in the Scan.toml of each package

error.invalid.config.table=\
  ''{0}'' must be a table, written as [{0}]

error.invalid.analyzer.list=\
  ''analyzer'' must be written as [[analyzer]] tables, or as analyzer = [] to clear the workspace analyzers

# --------------------------
# Scan Tool warning messages
# --------------------------
warning.report.not.supported=\
  generating reports is not supported with single bal files, ignoring the flag and continuing the scans

warning.scan.report.not.supported=\
  generating scan reports is not supported with single bal files, ignoring the flag and continuing the scans

warning.unmatched.suppression=\
  suppression of ''{0}'' did not match any issue

warning.unmatched.blanket.suppression=\
  suppression of all rules did not match any issue

warning.duplicate.suppression.rule=\
  rule ''{0}'' is already suppressed on this construct

warning.duplicate.blanket.suppression=\
  every rule is already suppressed on this construct

warning.ignored.suppression=\
  suppression could not be applied to this construct and is ignored

warning.unknown.rule.provider=\
  cannot verify rule ''{0}'': ''{1}'' provides no scan rules to this project; add its analyzer as a direct \
  dependency or in the [[analyzer]] table of Scan.toml

warning.setting.overridden=\
  {0} overrides {1} in {2}

warning.empty.package.skipped=\
  {0} has no sources to scan and is skipped

warning.platform.failed=\
  platform ''{0}'' failed and the issues were not reported to it: {1}

warning.exclude.tests.not.supported=\
  a single bal file has no tests to exclude, ignoring --exclude-tests

warning.workspace.rule.not.available=\
  {0} in [rule] of {1} {2,choice,1#is not a rule|1<are not rules} of {3}
