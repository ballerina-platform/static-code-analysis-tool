import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort

plugins {
    id 'java-library'
    id 'checkstyle'
    id 'com.github.spotbugs'
    id 'de.undercouch.download'
}

group = "${group}"
version = "${scanPackageVersion}"

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
    maven {
        url = 'https://maven.pkg.github.com/ballerina-platform/*'
        credentials {
            username System.getenv("packageUser")
            password System.getenv("packagePAT")
        }
    }
}

dependencies {
    compileOnly group: 'org.ballerinalang', name: 'ballerina-lang', version: "${scanPackageBallerinaLangVersion}"
    compileOnly group: 'org.ballerinalang', name: 'ballerina-parser', version: "${scanPackageBallerinaLangVersion}"
    compileOnly group: 'org.ballerinalang', name: 'ballerina-tools-api', version: "${scanPackageBallerinaLangVersion}"
    compileOnly group: 'org.ballerinalang', name: 'toml-parser', version: "${scanPackageBallerinaLangVersion}"
    checkstyle group: 'com.puppycrawl.tools', name: 'checkstyle', version: "${puppycrawlCheckstyleVersion}"
}

// The plugin is loaded by every distribution from 2201.12.0 on, the oldest of which runs on Java 21
tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

jar {
    archiveBaseName = 'scan-compiler-plugin'
}

// Setting up checkstyles
tasks.register('downloadCheckstyleRuleFiles', Download) {
    src([
            'https://raw.githubusercontent.com/wso2/code-quality-tools/v1.4/checkstyle/jdk-17/checkstyle.xml',
            'https://raw.githubusercontent.com/wso2/code-quality-tools/v1.4/checkstyle/jdk-17/suppressions.xml'
    ])
    overwrite false
    onlyIfNewer true
    dest buildDir
}

artifacts.add('default', file("${project.buildDir}/checkstyle.xml")) {
    builtBy(downloadCheckstyleRuleFiles)
}

artifacts.add('default', file("${project.buildDir}/suppressions.xml")) {
    builtBy(downloadCheckstyleRuleFiles)
}

checkstyle {
    toolVersion "${project.puppycrawlCheckstyleVersion}"
    configFile rootProject.file("${project.buildDir}/checkstyle.xml")
    configProperties = ["suppressionFile": file("${project.buildDir}/suppressions.xml")]
}

checkstyleMain.dependsOn(downloadCheckstyleRuleFiles)
checkstyleTest.dependsOn(downloadCheckstyleRuleFiles)

// Setting up spotbugs
spotbugsMain {
    effort = Effort.valueOf("MAX")
    reportLevel = Confidence.valueOf("LOW")
    reportsDir = file("$project.buildDir/reports/spotbugs")
    reports {
        html.required.set(true)
        text.required.set(true)
    }
    def excludeFile = file("${projectDir}/spotbugs-exclude.xml")
    if (excludeFile.exists()) {
        excludeFilter = excludeFile
    }
}

// Configurations to build the ballerina/scan package and deploy it to the local and central caches
def packageOrg = "ballerina"
def packageName = "scan"
def tomlVersion = "${version}"
def packageDir = "${projectDir}/ballerina"
def ballerinaTomlFilePlaceHolder = new File("${rootDir}/build-config/resources/scan-package/Ballerina.toml")
def compilerPluginTomlFilePlaceHolder = new File("${rootDir}/build-config/resources/scan-package/CompilerPlugin.toml")
def ballerinaTomlFile = new File("${packageDir}/Ballerina.toml")
def compilerPluginTomlFile = new File("${packageDir}/CompilerPlugin.toml")
def ballerinaCentralDir = System.getProperty("user.home") + "/.ballerina/repositories/central.ballerina.io/bala/${packageOrg}"
def ballerinaLocalDir = System.getProperty("user.home") + "/.ballerina/repositories/local/bala/${packageOrg}"
def balCentralCacheDir = project.file(System.getProperty("user.home") + "/.ballerina/repositories/central.ballerina.io")

tasks.register('updateTomlFiles') {
    doLast {
        def newConfig = ballerinaTomlFilePlaceHolder.text.replace("@toml.distribution@", scanPackageBallerinaLangVersion)
        ballerinaTomlFile.text = newConfig.replace("@toml.version@", tomlVersion)
        compilerPluginTomlFile.text = compilerPluginTomlFilePlaceHolder.text.replace("@toml.version@", tomlVersion)
    }
}

tasks.register('buildScanPackage') {
    dependsOn jar
    dependsOn updateTomlFiles
    dependsOn ':unpackScanPackageBallerinaDistribution'
    doLast {
        rootProject.runScanPackageBal(file(packageDir), 'pack')
        rootProject.runScanPackageBal(file(packageDir), 'push', '--repository=local')
        println("Successfully built and pushed the package ${packageOrg}/${packageName} to the local repository")

        delete {
            fileTree(balCentralCacheDir).matching {
                include 'cache-*'
            }
        }

        // Tests resolve the package from the central cache, as a project importing it would
        def balDestinationDir = "$ballerinaCentralDir/$packageName"
        def balSourceDir = "$ballerinaLocalDir/$packageName"
        if (file(balDestinationDir).exists()) {
            file(balDestinationDir).deleteDir()
        }
        copy {
            from balSourceDir
            into balDestinationDir
        }
        println("Successfully copied package ${packageOrg}/${packageName} to the central.ballerina.io/bala directory")
    }
}

tasks.named('build') {
    dependsOn buildScanPackage
}

tasks.register('publishBallerinaPackage') {
    dependsOn jar
    dependsOn updateTomlFiles
    dependsOn ':unpackScanPackageBallerinaDistribution'
    doLast {
        rootProject.runScanPackageBal(file(packageDir), 'pack')
        rootProject.runScanPackageBal(file(packageDir), 'push')
        println("Successfully published the ${packageOrg}/${packageName} package to central.")
    }
}
