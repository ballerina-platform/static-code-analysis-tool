name: "💡 New Feature Request"
description: Suggest new functionality for `bal scan`. For a new rule, use "Request a New Rule".
labels: ["Type/New Feature"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - Configuration
        - Reports
        - Core
        - Build
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is the problem this feature will solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to have.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Describe any alternatives you have considered.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version
      description: The `scan` version shown by `bal tool list`.
    validations:
      required: false
