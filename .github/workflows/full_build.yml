name: Full Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ubuntu_build:
    name: Build on Ubuntu with tests
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}-ubuntu
      cancel-in-progress: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21.0.6'

      - name: Set Up Ballerina
        uses: ballerina-platform/setup-ballerina@v1.1.5
        with:
          version: 2201.13.2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        env:
          packageUser: ${{ github.actor }}
          packagePAT: ${{ secrets.GITHUB_TOKEN }}
        run: unset BALLERINA_HOME && ./gradlew build --scan

      - name: Generate Jacoco report
        run: ./gradlew createCodeCoverageReport

      - name: Generate Codecov Report
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./.jacoco/reports/jacoco/report.xml

  windows_build:
    name: Build on Windows with tests
    runs-on: windows-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}-windows
      cancel-in-progress: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21.0.6'

      - name: Set Up Ballerina
        uses: ballerina-platform/setup-ballerina@v1.1.5
        with:
          version: 2201.13.2

      - name: Build with Gradle
        env:
          packageUser: ${{ github.actor }}
          packagePAT: ${{ secrets.GITHUB_TOKEN }}
        run: Remove-Item Env:BALLERINA_HOME -ErrorAction SilentlyContinue;  ./gradlew build --scan
