name: Label Issue Area

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const match = /^### Area\s+(\w+)/m.exec(context.payload.issue.body ?? '');
            const areas = ['CLI', 'Configuration', 'Reports', 'Core', 'Build'];
            if (match && areas.includes(match[1])) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: context.issue.number,
                labels: [`Area/${match[1]}`],
              });
            }
