name: Publish to the Ballerina DEV/STAGE central

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Select environment
        required: true
        options:
          - DEV CENTRAL
          - STAGE CENTRAL
      publish-target:
        type: choice
        description: "What to publish: the scan tool, the ballerina/scan package, or all of them"
        required: true
        default: tool
        options:
          - tool
          - package
          - all

jobs:
  call_workflow:
    name: Run Central Publish Workflow
    if: ${{ github.repository_owner == 'ballerina-platform' }}
    uses: ballerina-platform/ballerina-library/.github/workflows/central-publish-template.yml@main
    secrets: inherit
    with:
      environment: ${{ github.event.inputs.environment }}
      additional-publish-flags: -PpublishTarget=${{ inputs.publish-target }}
